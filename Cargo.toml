[package]
name = "abigfiletether"
version = "0.1.0"
edition = "2024"
description = "非侵入式大文件影子追踪工具（Git 只存元数据，真实文件原位不动）"
license = "MIT"

[[bin]]
name = "tether"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bincode = "1.3"
blake3 = "1.8.7"
clap = { version = "4", features = ["derive"] }
ignore = "0.4.33"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
toml = "1.1.6"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
