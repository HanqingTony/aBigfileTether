[package]
name = "abigfiletether"
version = "0.2.1"
edition = "2024"
description = "非侵入式大文件影子追踪工具（Git 只存元数据，真实文件原位不动）"
license = "MIT"

[[bin]]
name = "tether"
path = "src/main.rs"

[features]
default = []
# 纯 Rust SSH 传输后端（可选；默认用系统 ssh）
russh = ["dep:russh", "dep:tokio"]

[dependencies]
anyhow = "1.0.104"
bincode = "1.3"
blake3 = "1.8.7"
clap = { version = "4", features = ["derive"] }
ignore = "0.4.33"
rayon = "1.12.0"
russh = { version = "0.63", optional = true, default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
toml = "1.1.6"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
